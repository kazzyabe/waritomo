<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ワリトモ</title>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script async src="https://yads.c.yimg.jp/js/yads-async.js"></script>
    <style>
      :root {
        color-scheme: light;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #eef3f6;
        color: #162126;
        --line: #06c755;
        --line-dark: #07863e;
        --ink: #162126;
        --muted: #69777f;
        --soft: #f5f8f9;
        --border: #e3eaee;
        --blue: #2f7de1;
        --coral: #e66d56;
        --yellow: #f4bc41;
        --panel: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      html {
        min-height: 100%;
        background: #dfe9ed;
      }

      body {
        min-height: 100%;
        margin: 0;
        background:
          linear-gradient(180deg, rgba(6, 199, 85, 0.08), transparent 240px),
          #eef3f6;
      }

      button,
      input,
      select {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.56;
      }

      .app-shell {
        width: min(100%, 480px);
        min-height: 100vh;
        margin: 0 auto;
        padding: max(env(safe-area-inset-top), 10px) 16px 28px;
        background: #fbfcfc;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 10px;
        padding: 8px 2px 14px;
      }

      .brand-button {
        display: inline-block;
        max-width: 100%;
        padding: 0;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }

      .brand-button:focus-visible {
        outline: 3px solid rgba(6, 199, 85, 0.28);
        outline-offset: 3px;
      }

      .brand {
        display: grid;
        flex: 1 1 auto;
        gap: 3px;
        min-width: 0;
      }

      .brand small {
        color: var(--line-dark);
        font-size: 11px;
        font-weight: 800;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      h1 {
        font-size: 25px;
        line-height: 1.18;
      }

      h2 {
        font-size: 18px;
        line-height: 1.35;
      }

      h3 {
        font-size: 15px;
        line-height: 1.35;
      }

      .top-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: 0 0 auto;
      }

      .menu-button {
        background: #ffffff;
      }

      .home-view,
      .detail-view {
        display: grid;
        gap: 12px;
      }

      .home-hero {
        display: grid;
        gap: 16px;
        padding: 16px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background:
          linear-gradient(135deg, rgba(6, 199, 85, 0.13), rgba(47, 125, 225, 0.08)),
          #ffffff;
        box-shadow: 0 10px 28px rgba(34, 52, 61, 0.07);
      }

      .home-hero-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
      }

      .home-kpis {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .home-kpi {
        display: inline-flex;
        align-items: center;
        min-height: 30px;
        padding: 0 10px;
        border: 1px solid rgba(6, 199, 85, 0.18);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.68);
        color: #234049;
        font-size: 12px;
        font-weight: 850;
      }

      .home-row {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 12px;
        width: 100%;
        min-height: 74px;
        padding: 13px 14px;
        border: 0;
        border-top: 1px solid #edf2f4;
        background: #ffffff;
        color: var(--ink);
        text-align: left;
      }

      .home-row:active {
        background: #f4faf6;
      }

      .home-row .row-main:last-child {
        justify-items: end;
      }

      .home-badges {
        display: flex;
        justify-content: flex-end;
        gap: 6px;
      }

      .home-ad {
        display: grid;
        justify-items: center;
        padding: 2px 0 0;
      }

      .yads-slot {
        width: 300px;
        max-width: 100%;
        min-height: 250px;
        overflow: hidden;
      }

      .notice {
        display: grid;
        gap: 5px;
        padding: 12px 14px;
        border: 1px solid #f1dac2;
        border-radius: 8px;
        background: #fff8ef;
        color: #704714;
        font-size: 13px;
        font-weight: 750;
      }

      .notice strong {
        color: #573508;
      }

      .inline-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .claim-grid {
        display: grid;
        gap: 8px;
      }

      .claim-card {
        display: grid;
        grid-template-columns: 18px 1fr;
        align-items: center;
        gap: 8px;
        min-height: 42px;
        padding: 8px 10px;
        border: 1px solid #dfe8ec;
        border-radius: 8px;
        background: #ffffff;
        color: var(--ink);
        font-size: 14px;
        font-weight: 850;
      }

      .claim-card input {
        width: 18px;
        min-height: 18px;
        accent-color: var(--line);
      }

      .group-panel,
      .section,
      .sheet-panel {
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: 0 10px 28px rgba(34, 52, 61, 0.07);
      }

      .group-panel {
        display: grid;
        gap: 18px;
        padding: 16px;
      }

      .group-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }

      .group-title {
        display: grid;
        flex: 1 1 168px;
        gap: 5px;
        min-width: 0;
      }

      .group-name-line {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }

      .group-name-line h2 {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .head-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 8px;
        flex: 0 0 auto;
        max-width: 232px;
      }

      .group-picker {
        width: min(100%, 230px);
        min-height: 36px;
        margin-top: 4px;
        padding: 0 10px;
        font-size: 13px;
        font-weight: 850;
      }

      .caption {
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }

      .amount-large {
        color: var(--ink);
        font-size: clamp(31px, 11vw, 45px);
        font-weight: 900;
        line-height: 1;
      }

      .icon-button {
        display: inline-grid;
        place-items: center;
        width: 40px;
        height: 40px;
        flex: 0 0 auto;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #ffffff;
        color: var(--ink);
      }

      .icon-button.success {
        border-color: #bee7ca;
        background: #ecf9f1;
        color: #087a39;
      }

      .icon-button.danger {
        border-color: #f3d5ce;
        background: #fff3f0;
        color: #bf4b36;
      }

      .icon {
        width: 19px;
        height: 19px;
        stroke: currentColor;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }

      .app-menu {
        position: fixed;
        inset: 0;
        z-index: 35;
        padding: calc(max(env(safe-area-inset-top), 10px) + 54px) 16px 16px;
        background: rgba(22, 33, 38, 0.2);
      }

      .app-menu-panel {
        display: grid;
        gap: 12px;
        width: min(100%, 448px);
        margin: 0 auto;
        padding: 14px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 18px 48px rgba(22, 33, 38, 0.18);
      }

      .app-menu-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
      }

      .app-menu-links {
        display: grid;
        gap: 8px;
      }

      .app-menu-link {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 44px;
        padding: 0 12px;
        border: 1px solid #e5edf1;
        border-radius: 8px;
        background: #f7fafb;
        color: var(--ink);
        font-size: 14px;
        font-weight: 850;
        text-decoration: none;
      }

      .app-menu-link::after {
        content: "";
        width: 8px;
        height: 8px;
        border-top: 2px solid currentColor;
        border-right: 2px solid currentColor;
        opacity: 0.44;
        transform: rotate(45deg);
      }

      .app-menu-info {
        display: grid;
        gap: 8px;
        padding-top: 12px;
        border-top: 1px solid var(--border);
      }

      .app-menu-info-row {
        display: grid;
        gap: 2px;
        color: var(--ink);
        font-size: 13px;
        font-weight: 750;
        line-height: 1.45;
      }

      .app-menu-info-row a {
        color: var(--line-dark);
        text-decoration: none;
      }

      .member-strip {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 34px;
      }

      .avatar {
        display: inline-grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border: 2px solid #ffffff;
        border-radius: 50%;
        color: #ffffff;
        font-size: 13px;
        font-weight: 900;
        box-shadow: 0 4px 12px rgba(22, 33, 38, 0.13);
      }

      .avatar.small {
        width: 28px;
        height: 28px;
        font-size: 11px;
      }

      .member-count {
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }

      .summary-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .metric {
        min-width: 0;
        padding: 12px;
        border: 1px solid #e7edf1;
        border-radius: 8px;
        background: var(--soft);
      }

      .metric strong {
        display: block;
        margin-top: 5px;
        font-size: 17px;
        line-height: 1.25;
        word-break: keep-all;
      }

      .metric.positive strong {
        color: var(--blue);
      }

      .metric.negative strong {
        color: var(--coral);
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr 46px;
        gap: 10px;
        margin: 12px 0 14px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 48px;
        border: 0;
        border-radius: 8px;
        background: var(--line);
        color: #ffffff;
        font-size: 15px;
        font-weight: 900;
        text-decoration: none;
      }

      .button.secondary {
        border: 1px solid #cdebd8;
        background: #eefaf2;
        color: var(--line-dark);
      }

      .button.subtle {
        border: 1px solid var(--border);
        background: #ffffff;
        color: var(--ink);
      }

      .button.danger {
        border: 1px solid #f3d5ce;
        background: #fff3f0;
        color: #c84932;
      }

      .tabs {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 4px;
        padding: 4px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #ecf1f3;
      }

      .tab {
        min-height: 38px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--muted);
        font-size: 14px;
        font-weight: 900;
      }

      .tab.active {
        background: #ffffff;
        color: var(--ink);
        box-shadow: 0 3px 10px rgba(34, 52, 61, 0.08);
      }

      .view {
        display: grid;
        gap: 12px;
        padding-top: 14px;
      }

      .section {
        overflow: hidden;
      }

      .section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 15px 14px 10px;
      }

      .section-body {
        display: grid;
        gap: 0;
      }

      .expense-row,
      .settlement-row,
      .member-row,
      .balance-row {
        display: grid;
        align-items: center;
        gap: 12px;
        min-height: 66px;
        padding: 12px 14px;
        border-top: 1px solid #edf2f4;
      }

      .expense-row {
        grid-template-columns: 36px 1fr auto;
      }

      .settlement-row {
        grid-template-columns: 1fr auto;
      }

      .settlement-row.with-check {
        grid-template-columns: 34px 1fr auto;
      }

      .settlement-row.confirmed {
        background: #f5faf7;
      }

      .member-row {
        grid-template-columns: 34px 1fr auto;
      }

      .balance-row {
        grid-template-columns: 1fr auto;
      }

      .row-main {
        display: grid;
        gap: 4px;
        min-width: 0;
      }

      .row-title {
        overflow: hidden;
        font-size: 15px;
        font-weight: 900;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .row-meta {
        overflow: hidden;
        color: var(--muted);
        font-size: 12px;
        font-weight: 650;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .expense-meta {
        display: grid;
        gap: 2px;
        min-width: 0;
      }

      .expense-meta .row-meta {
        overflow: visible;
        line-height: 1.35;
        text-overflow: clip;
        white-space: normal;
        overflow-wrap: anywhere;
      }

      .row-amount {
        color: var(--ink);
        font-size: 15px;
        font-weight: 900;
        white-space: nowrap;
      }

      .tag {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 24px;
        padding: 0 8px;
        border-radius: 6px;
        background: #eef5fb;
        color: #2f6cb9;
        font-size: 12px;
        font-weight: 900;
        white-space: nowrap;
      }

      .tag.complete {
        border: 1px solid #bee7ca;
        background: #ecf9f1;
        color: #087a39;
      }

      .empty-state {
        display: grid;
        gap: 8px;
        padding: 28px 18px;
        color: var(--muted);
        text-align: center;
      }

      .empty-state strong {
        color: var(--ink);
      }

      .mini-action {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 32px;
        padding: 0 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #ffffff;
        color: var(--ink);
        font-size: 12px;
        font-weight: 900;
      }

      .mini-action.danger {
        color: #bf4b36;
      }

      .icon-check {
        display: inline-grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border: 1px solid #dce7df;
        border-radius: 8px;
        background: #ffffff;
        color: transparent;
      }

      .icon-check.checked {
        border-color: #b8e8c9;
        background: #eaf9ef;
        color: var(--line-dark);
      }

      .share-bar {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(0, 1fr));
        gap: 10px;
        padding: 12px 14px 14px;
        border-top: 1px solid #edf2f4;
      }

      .field-grid {
        display: grid;
        gap: 12px;
      }

      label {
        display: grid;
        gap: 6px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 850;
      }

      .field-help {
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        line-height: 1.35;
      }

      input,
      select,
      textarea {
        width: 100%;
        min-height: 46px;
        border: 1px solid #d9e3e8;
        border-radius: 8px;
        background: #ffffff;
        color: var(--ink);
        padding: 0 12px;
        font-size: 15px;
        outline: none;
      }

      textarea {
        min-height: 92px;
        padding: 12px;
        line-height: 1.5;
        resize: vertical;
      }

      input:focus,
      select:focus,
      textarea:focus {
        border-color: var(--line);
        box-shadow: 0 0 0 3px rgba(6, 199, 85, 0.13);
      }

      .checkbox-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .check-card {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 42px;
        padding: 8px 10px;
        border: 1px solid #dfe8ec;
        border-radius: 8px;
        background: #ffffff;
        color: var(--ink);
        font-size: 14px;
        font-weight: 850;
      }

      .check-card input {
        width: 18px;
        min-height: 18px;
        accent-color: var(--line);
      }

      .sheet {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: grid;
        align-items: end;
        padding: 16px;
        background: rgba(19, 31, 37, 0.4);
      }

      .sheet-panel {
        width: min(100%, 448px);
        max-height: min(86vh, 720px);
        margin: 0 auto;
        overflow: auto;
      }

      .sheet-head {
        position: sticky;
        top: 0;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 16px;
        border-bottom: 1px solid var(--border);
        background: #ffffff;
      }

      .sheet-body {
        display: grid;
        gap: 14px;
        padding: 16px;
      }

      .error-text {
        min-height: 18px;
        color: #c84932;
        font-size: 12px;
        font-weight: 800;
      }

      .toast {
        position: fixed;
        right: 16px;
        bottom: calc(16px + env(safe-area-inset-bottom));
        left: 16px;
        z-index: 30;
        display: grid;
        place-items: center;
        min-height: 44px;
        max-width: 448px;
        margin: 0 auto;
        padding: 10px 14px;
        border-radius: 8px;
        background: #162126;
        color: #ffffff;
        font-size: 14px;
        font-weight: 850;
        box-shadow: 0 16px 36px rgba(22, 33, 38, 0.28);
      }

      @media (max-width: 360px) {
        .app-shell {
          padding-right: 12px;
          padding-left: 12px;
        }

        .summary-grid,
        .share-bar,
        .checkbox-grid {
          grid-template-columns: 1fr;
        }

        .amount-large {
          font-size: 34px;
        }
      }
    </style>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <button id="home-button" class="icon-button" type="button" aria-label="ホーム" hidden>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="m3 10 9-7 9 7" />
            <path d="M5 10v10h14V10" />
            <path d="M9 20v-6h6v6" />
          </svg>
        </button>
        <div class="brand">
          <small>LINE MINI APP</small>
          <h1><button id="brand-home" class="brand-button" type="button" aria-label="ホームに戻る">ワリトモ</button></h1>
        </div>
        <div class="top-actions">
          <button id="menu-button" class="icon-button menu-button" type="button" aria-label="メニュー" aria-expanded="false" aria-controls="app-menu">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 7h16" />
              <path d="M4 12h16" />
              <path d="M4 17h16" />
            </svg>
          </button>
        </div>
      </header>

      <div id="app-menu" class="app-menu" hidden>
        <div class="app-menu-panel" role="dialog" aria-modal="true" aria-labelledby="app-menu-title">
          <div class="app-menu-head">
            <div>
              <span class="caption">メニュー</span>
              <h2 id="app-menu-title">ワリトモ</h2>
            </div>
            <button class="icon-button" type="button" data-close-menu aria-label="メニューを閉じる">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M18 6 6 18" />
                <path d="m6 6 12 12" />
              </svg>
            </button>
          </div>
          <nav class="app-menu-links" aria-label="アプリメニュー">
            <a class="app-menu-link" href="/service-overview">サービス概要</a>
            <a class="app-menu-link" href="/privacy">プライバシーポリシー</a>
            <a class="app-menu-link" href="/terms">利用規約</a>
            <a class="app-menu-link" href="/support">サポート・お問い合わせ</a>
          </nav>
          <div class="app-menu-info" aria-label="運営情報">
            <div class="app-menu-info-row">
              <span class="caption">運営会社</span>
              <strong>Plus Insight株式会社</strong>
            </div>
            <div class="app-menu-info-row">
              <span class="caption">所在地</span>
              <span>東京都千代田区神田和泉町1番地6-16ヤマトビル405</span>
            </div>
            <div class="app-menu-info-row">
              <span class="caption">連絡先</span>
              <a href="tel:0365552793">0365552793</a>
            </div>
          </div>
        </div>
      </div>

      <section id="home-view" class="home-view"></section>
      <section id="home-ad" class="home-ad" aria-label="広告" hidden>

    <div id="toast" class="toast" role="status" hidden></div>

    <script>
      const colors = ["#06c755", "#2f7de1", "#e66d56", "#9b7a2e", "#6c63c7", "#169c96"];

      const initialState = {
        activeGroupId: "",
        groupName: "グループ未作成",
        activeTab: "expenses",
        inviteToken: "",
        canManage: false,
        completedAt: null,
        settlementChecks: {},
        groups: [],
        members: [],
        expenses: [],
      };

      let state = loadState();
      let settlement = { balances: {}, items: [], baseCurrencyCode: "JPY", confirmations: [] };
      let config = {
        line: { liffId: "", miniAppBaseUrl: "" },
        storage: { mode: "database" },
        analytics: { measurementId: "" },
      };
      let remoteReady = false;
      let currentUserName = "あなた";
      let currentUserAuthenticated = false;
      let settlementRequestId = 0;
      let toastTimer;
      let editingExpenseId = "";
      let cloudStorageNotice = "";
      let appUnavailable = false;
      let inviteContext = parseInviteRoute();
      let invitePreview = null;
      let lineContext = null;
      let canSendToCurrentChat = false;
      let homeAdRequested = false;

      const yenFormatter = new Intl.NumberFormat("ja-JP", {
        style: "currency",
        currency: "JPY",
        maximumFractionDigits: 0,
      });
      const updatedAtFormatter = new Intl.DateTimeFormat("ja-JP", {
        month: "numeric",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit",
      });
      const expenseDateFormatter = new Intl.DateTimeFormat("ja-JP", {
        month: "numeric",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit",
      });

      const elements = {
        homeButton: document.getElementById("home-button"),
        homeView: document.getElementById("home-view"),
        homeAd: document.getElementById("home-ad"),
        detailView: document.getElementById("detail-view"),
        groupName: document.getElementById("group-name"),
        groupStatus: document.getElementById("group-status"),
        totalAmount: document.getElementById("total-amount"),
        memberStrip: document.getElementById("member-strip"),
        myBalance: document.getElementById("my-balance"),
        myBalanceMetric: document.getElementById("my-balance-metric"),
        settlementCount: document.getElementById("settlement-count"),
        openExpense: document.getElementById("open-expense"),
        editGroupNameButton: document.getElementById("edit-group-name-button"),
        toggleGroupCompleteButton: document.getElementById("toggle-group-complete-button"),
        deleteGroupButton: document.getElementById("delete-group-button"),
        expensesView: document.getElementById("expenses-view"),
        settlementView: document.getElementById("settlement-view"),
        membersView: document.getElementById("members-view"),
        groupPicker: document.getElementById("group-picker"),
        menuButton: document.getElementById("menu-button"),
        appMenu: document.getElementById("app-menu"),
        sheet: document.getElementById("expense-sheet"),
        groupSheet: document.getElementById("group-sheet"),
        editGroupSheet: document.getElementById("edit-group-sheet"),
        form: document.getElementById("expense-form"),
        groupForm: document.getElementById("group-form"),
        editGroupForm: document.getElementById("edit-group-form"),
        expenseSheetTitle: document.getElementById("expense-sheet-title"),
        expenseSubmit: document.getElementById("expense-submit"),
        title: document.getElementById("expense-title"),
        amount: document.getElementById("expense-amount"),
        payer: document.getElementById("expense-payer"),
        debtorOptions: document.getElementById("debtor-options"),
        formError: document.getElementById("form-error"),
        newGroupName: document.getElementById("new-group-name"),
        newGroupMembers: document.getElementById("new-group-members"),
        groupFormError: document.getElementById("group-form-error"),
        editGroupName: document.getElementById("edit-group-name"),
        editGroupFormError: document.getElementById("edit-group-form-error"),
        brandHome: document.getElementById("brand-home"),
        toast: document.getElementById("toast"),
      };
      let currentScreen = "home";

      function loadState() {
        return structuredClone(initialState);
      }

      function saveState(options = {}) {
        syncActiveGroup(options);
      }

      function goHome() {
        syncActiveGroup();
        currentScreen = "home";
        render();
        trackEvent("view_home");
      }

      function openAppMenu() {
        elements.appMenu.hidden = false;
        elements.menuButton.setAttribute("aria-expanded", "true");
        trackEvent("menu_opened");
      }

      function closeAppMenu() {
        elements.appMenu.hidden = true;
        elements.menuButton.setAttribute("aria-expanded", "false");
      }

      function normalizeMemberLinks(members, options = {}) {
        const shouldDefaultFirst = options.defaultFirst !== false;
        const hasCurrentMember = members.some((member) => member.linkedToCurrentUser);
        return members.map((member, index) => {
          const linkedToCurrentUser = Boolean(member.linkedToCurrentUser || (shouldDefaultFirst && !hasCurrentMember && index === 0));
          return {
            ...member,
            linkedToCurrentUser,
            available: linkedToCurrentUser ? false : member.available !== false,
          };
        });
      }

      function normalizeExpenses(expenses, fallbackDate = new Date().toISOString()) {
        return (expenses ?? []).map((expense) => ({
          ...expense,
          amount: Number(expense.amount || 0),
          debtorMemberIds: Array.isArray(expense.debtorMemberIds) ? expense.debtorMemberIds.map(String) : [],
          createdAt: expense.createdAt || expense.created_at || fallbackDate,
        }));
      }

      function normalizeState(nextState) {
        if (Array.isArray(nextState?.groups) && nextState.groups.length === 0 && !nextState.activeGroupId) {
          return emptyRemoteState([]);
        }
        if (!nextState?.members?.length || !Array.isArray(nextState.expenses)) return null;

        const normalized = {
          ...nextState,
          activeGroupId: nextState.activeGroupId || "g-demo",
          activeTab: nextState.activeTab || "expenses",
          inviteToken: nextState.inviteToken || "",
          canManage: nextState.canManage !== false,
          completedAt: nextState.completedAt || null,
          settlementChecks: nextState.settlementChecks ?? {},
          groups: Array.isArray(nextState.groups) ? nextState.groups : [],
        };

        if (normalized.groups.length === 0) {
          normalized.groups = [snapshotCurrentGroup(normalized, normalized.activeGroupId)];
        }

        normalized.groups = normalized.groups.map((group) => normalizeGroupSummary(group, group));
        const activeGroup = normalized.groups.find((group) => group.id === normalized.activeGroupId) ?? normalized.groups[0];
        normalized.activeGroupId = activeGroup.id;
        normalized.groupName = activeGroup.groupName;
        normalized.inviteToken = activeGroup.inviteToken || normalized.inviteToken || "";
        normalized.canManage = activeGroup.canManage !== false;
        normalized.completedAt = activeGroup.completedAt || null;
        normalized.settlementChecks = activeGroup.settlementChecks ?? normalized.settlementChecks ?? {};
        normalized.members = normalizeMemberLinks(structuredClone(activeGroup.members ?? []));
        normalized.expenses = normalizeExpenses(structuredClone(activeGroup.expenses ?? []), activeGroup.updatedAt);
        return normalized;
      }

      function snapshotCurrentGroup(source = state, id = source.activeGroupId, options = {}) {
        const existing = source.groups?.find((group) => group.id === id);
        const members = structuredClone(source.members ?? []);
        const expenses = normalizeExpenses(structuredClone(source.expenses ?? []), source.updatedAt);
        return normalizeGroupSummary(
          {
            id,
            groupName: source.groupName,
            inviteToken: source.inviteToken,
            canManage: source.canManage,
            completedAt: source.completedAt || null,
            settlementChecks: source.settlementChecks,
            members,
            expenses,
          },
          existing,
          options,
        );
      }

      function normalizeGroupSummary(group, fallback = {}, options = {}) {
        const members = group.members ?? fallback.members ?? [];
        const expenses = normalizeExpenses(group.expenses ?? fallback.expenses ?? [], group.updatedAt || fallback.updatedAt);
        const completedAt = Object.hasOwn(group, "completedAt")
          ? group.completedAt
          : Object.hasOwn(group, "completed_at")
            ? group.completed_at
            : fallback.completedAt || null;
        const totalAmount = expenses.length
          ? expenses.reduce((sum, expense) => sum + Number(expense.amount || 0), 0)
          : Number(group.totalAmount ?? fallback.totalAmount ?? 0);
        const updatedAt = options.touch
          ? new Date().toISOString()
          : group.updatedAt || fallback.updatedAt || group.createdAt || fallback.createdAt || new Date().toISOString();

        return {
          id: group.id || fallback.id,
          groupName: group.groupName || group.name || fallback.groupName || "名称未設定",
          memberCount: Number(group.memberCount ?? fallback.memberCount ?? members.length ?? 0),
          expenseCount: Number(group.expenseCount ?? fallback.expenseCount ?? expenses.length ?? 0),
          totalAmount,
          updatedAt,
          completedAt,
          inviteToken: group.inviteToken || fallback.inviteToken || "",
          canManage: group.canManage ?? fallback.canManage ?? true,
          settlementChecks: group.settlementChecks ?? fallback.settlementChecks ?? {},
          ...(group.members ? { members: structuredClone(group.members) } : {}),
          ...(group.expenses ? { expenses } : {}),
        };
      }

      function syncActiveGroup(options = {}) {
        if (!state.activeGroupId) return;
        const index = state.groups.findIndex((group) => group.id === state.activeGroupId);
        const snapshot = snapshotCurrentGroup(state, state.activeGroupId, options);
        if (index >= 0) state.groups[index] = snapshot;
        else state.groups.unshift(snapshot);
        state.groups = sortGroupSummaries(state.groups);
      }

      function emptyRemoteState(groups = []) {
        return {
          activeGroupId: "",
          groupName: "グループ未作成",
          activeTab: "expenses",
          inviteToken: "",
          canManage: false,
          completedAt: null,
          settlementChecks: {},
          groups,
          members: [],
          expenses: [],
        };
      }

      function useRemote() {
        return config.storage?.mode === "database";
      }

      function canUseDatabase() {
        return useRemote() && !appUnavailable;
      }

      function unavailableMessage() {
        return "クラウド保存に接続できません。時間をおいて再度お試しください。";
      }

      function requireDatabaseAvailable() {
        if (canUseDatabase()) return true;
        showToast(unavailableMessage());
        return false;
      }

      function yen(value) {
        return yenFormatter.format(Math.round(Number(value) || 0));
      }

      function parseInviteRoute() {
        const match = location.pathname.match(/^\/groups\/([^/]+)\/invite\/?$/);
        if (!match) return null;
        return {
          groupId: decodeURIComponent(match[1]),
          token: new URLSearchParams(location.search).get("token") || "",
        };
      }

      function groupTimestamp(group) {
        const time = Date.parse(group?.updatedAt || group?.createdAt || "");
        return Number.isFinite(time) ? time : 0;
      }

      function sortGroupSummaries(groups) {
        return [...(groups ?? [])]
          .map((group, index) => ({ group, index }))
          .sort((a, b) => groupTimestamp(b.group) - groupTimestamp(a.group) || a.index - b.index)
          .map(({ group }) => group);
      }

      function formatUpdatedAt(value) {
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return "最近";
        return updatedAtFormatter.format(date);
      }

      function formatExpenseDate(value) {
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return "日付不明";
        return expenseDateFormatter.format(date);
      }

      function isCurrentGroupCompleted() {
        return Boolean(state.completedAt);
      }

      function settlementItemKey(item) {
        return `${item.fromMemberId}:${item.toMemberId}:${Math.round(Number(item.amount) || 0)}`;
      }

      function confirmationKeys() {
        return new Set((settlement.confirmations ?? []).map(settlementItemKey));
      }

      function initializeAnalytics() {
        const measurementId = config.analytics?.measurementId;
        if (!measurementId || window.gtag) return;

        window.dataLayer = window.dataLayer || [];
        window.gtag = function gtag() {
          window.dataLayer.push(arguments);
        };

        const script = document.createElement("script");
        script.async = true;
        script.src = `https://www.googletagmanager.com/gtag/js?id=${encodeURIComponent(measurementId)}`;
        document.head.appendChild(script);

        window.gtag("js", new Date());
        window.gtag("config", measurementId, {
          send_page_view: false,
          app_name: "waritomo",
        });
      }

      function trackEvent(eventName, params = {}) {
        if (!window.gtag || !config.analytics?.measurementId) return;

        window.gtag("event", eventName, {
          app_name: "waritomo",
          app_mode: "line_mini_app",
          storage_mode: config.storage?.mode ?? "browser",
          screen_name: currentScreen,
          active_tab: state.activeTab,
          has_group: Boolean(state.activeGroupId),
          ...params,
        });
      }

      function trackPageView(pagePath = location.pathname) {
        if (!window.gtag || !config.analytics?.measurementId) return;

        window.gtag("event", "page_view", {
          page_title: document.title,
          page_location: location.href,
          page_path: pagePath,
          app_name: "waritomo",
          app_mode: "line_mini_app",
          storage_mode: config.storage?.mode ?? "browser",
          screen_name: currentScreen,
        });
      }

      function trackInitialPageView() {
        trackPageView(inviteContext ? "/groups/:groupId/invite" : location.pathname);
      }

      async function apiJson(path, options = {}) {
        const response = await fetch(path, {
          ...options,
          headers: {
            "content-type": "application/json",
            ...(options.headers ?? {}),
          },
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(data.message || data.error || "API request failed");
        }
        return data;
      }

      async function checkStorageStatus() {
        if (config.storage?.mode !== "database") {
          remoteReady = false;
          appUnavailable = true;
          cloudStorageNotice = unavailableMessage();
          state = emptyRemoteState([]);
          render();
          return false;
        }
        const status = await apiJson("/api/storage/status").catch(() => ({ available: false }));
        appUnavailable = !status.available;
        if (appUnavailable) {
          remoteReady = false;
          cloudStorageNotice = unavailableMessage();
          state = emptyRemoteState([]);
        } else {
          cloudStorageNotice = "";
        }
        render();
        return status.available;
      }

      async function loadInvitePreview() {
        if (!inviteContext || config.storage?.mode !== "database") return;
        invitePreview = await apiJson(
          `/api/invites/${encodeURIComponent(inviteContext.groupId)}?token=${encodeURIComponent(inviteContext.token)}`,
        );
        render();
      }

      function normalizeRemoteGroup(group, groupSummaries = state.groups, options = {}) {
        const members = normalizeMemberLinks(
          (group.members ?? []).map((member, index) => ({
            ...member,
            color: member.color || colors[index % colors.length],
          })),
          { defaultFirst: false },
        );

        return {
          activeGroupId: group.id,
          groupName: group.groupName,
          inviteToken: group.inviteToken || "",
          canManage: group.canManage !== false,
          completedAt: group.completedAt || null,
          settlementChecks: state.settlementChecks ?? {},
          activeTab: state.activeTab || "expenses",
          groups: upsertGroupSummary(groupSummaries, group, options),
          members,
          expenses: normalizeExpenses(group.expenses ?? [], group.updatedAt),
        };
      }

      function upsertGroupSummary(groups, group, options = {}) {
        const existing = (groups ?? []).find((item) => item.id === group.id);
        const summary = normalizeGroupSummary(group, existing, options);
        const rest = (groups ?? []).filter((item) => item.id !== group.id);
        return sortGroupSummaries([summary, ...rest]);
      }

      function applyRemoteGroup(group, groupSummaries = state.groups, options = {}) {
        state = normalizeRemoteGroup(group, groupSummaries, options);
        if (options.openDetail ?? currentScreen === "detail") currentScreen = "detail";
        render();
      }

      async function loadRemoteState() {
        if (config.storage?.mode !== "database") return false;

        const data = await apiJson("/api/groups");
        remoteReady = true;
        appUnavailable = false;
        cloudStorageNotice = "";

        if (!data.groups?.length) {
          state = emptyRemoteState([]);
          currentScreen = "home";
          settlement = { balances: {}, items: [], baseCurrencyCode: "JPY", confirmations: [] };
          render();
          showToast("クラウド保存に接続しました");
          return true;
        }

        const selectedGroup = data.groups.find((group) => group.id === state.activeGroupId) ?? data.groups[0];
        const group = await apiJson(`/api/groups/${encodeURIComponent(selectedGroup.id)}`);
        applyRemoteGroup(group, data.groups, { openDetail: false });
        await refreshSettlement();
        showToast("クラウド保存に接続しました");
        return true;
      }

      function memberById(id) {
        return state.members.find((member) => member.id === id);
      }

      function initials(name) {

      function expensePayloadFromForm(formData) {
        const title = String(formData.get("title") || "").trim();
        const amount = Number(String(formData.get("amount") || "").replace(/[^\d]/g, ""));
        const payerMemberId = String(formData.get("payer") || "");
        const debtorMemberIds = formData.getAll("debtor").map(String);
        return { title, amount, payerMemberId, debtorMemberIds };
      }

      function validateExpensePayload({ title, amount, payerMemberId, debtorMemberIds }) {
        if (!canUseDatabase()) return unavailableMessage();
        if (useRemote() && !state.activeGroupId) return "先にグループを作成してください";
        if (!title) return "内容を入力してください";
        if (!Number.isFinite(amount) || amount <= 0) return "金額を数字で入力してください（例: 6655）";
        if (!memberById(payerMemberId)) return "支払った人を選んでください";
        if (debtorMemberIds.length === 0) return "割り勘する人を選んでください";
        return "";
      }

      async function saveExpense(formData) {
        const payload = expensePayloadFromForm(formData);
        const error = validateExpensePayload(payload);
        if (error) return error;

        if (editingExpenseId) return updateExpense(editingExpenseId, payload);
        return addExpense(payload);
      }

      async function addExpense(payload) {
        const { title, amount, payerMemberId, debtorMemberIds } = payload;
        if (useRemote()) {
          const group = await apiJson(`/api/groups/${encodeURIComponent(state.activeGroupId)}/expenses`, {
            method: "POST",
            body: JSON.stringify(payload),
          });
          applyRemoteGroup(group, state.groups, { touch: true, openDetail: true });
          closeExpenseSheet();
          await refreshSettlement();
          trackEvent("expense_created", {
            member_count: state.members.length,
            debtor_count: debtorMemberIds.length,
          });
          showToast("支払いを保存しました");
          return "";
        }

        state.expenses.unshift({
          id: `e${Date.now().toString(36)}`,
          title,
          amount,
          payerMemberId,
          debtorMemberIds,
          createdAt: new Date().toISOString(),
        });
        state.completedAt = null;
        state.settlementChecks = {};
        saveState({ touch: true });
        closeExpenseSheet();
        refreshSettlement();
        trackEvent("expense_created", {
          member_count: state.members.length,
          debtor_count: debtorMemberIds.length,
        });
        showToast("支払いを追加しました");
        return "";
      }

      async function updateExpense(expenseId, payload) {
        if (useRemote()) {
          const group = await apiJson(
            `/api/groups/${encodeURIComponent(state.activeGroupId)}/expenses/${encodeURIComponent(expenseId)}`,
            {
              method: "PATCH",
              body: JSON.stringify(payload),
            },
          );
          applyRemoteGroup(group, state.groups, { touch: true, openDetail: true });
          closeExpenseSheet();
          await refreshSettlement();
          trackEvent("expense_updated", {
            member_count: state.members.length,
            debtor_count: payload.debtorMemberIds.length,
          });
          showToast("支払いを保存しました");
          return "";
        }

        state.expenses = state.expenses.map((expense) => (expense.id === expenseId ? { ...expense, ...payload } : expense));
        state.completedAt = null;
        state.settlementChecks = {};
        saveState({ touch: true });
        closeExpenseSheet();
        refreshSettlement();
        trackEvent("expense_updated", {
          member_count: state.members.length,
          debtor_count: payload.debtorMemberIds.length,
        });
        showToast("支払いを保存しました");
        return "";
      }

      async function switchGroup(groupId, options = {}) {
        if (!requireDatabaseAvailable()) return;
        const openDetail = options.openDetail ?? true;
        if (groupId === state.activeGroupId) {
          if (openDetail) {
            currentScreen = "detail";
            render();
          }
          return;
        }

        if (useRemote()) {
          const group = await apiJson(`/api/groups/${encodeURIComponent(groupId)}`);
          applyRemoteGroup(group, state.groups, { openDetail });
          await refreshSettlement();
          trackEvent("group_opened", {
            member_count: state.members.length,
            expense_count: state.expenses.length,
          });
          return;
        }

        syncActiveGroup();

        const nextGroup = state.groups.find((group) => group.id === groupId);
        if (!nextGroup) return;

        state.activeGroupId = nextGroup.id;
        state.groupName = nextGroup.groupName;
        state.inviteToken = nextGroup.inviteToken || "";
        state.canManage = nextGroup.canManage !== false;
        state.completedAt = nextGroup.completedAt || null;
        state.settlementChecks = nextGroup.settlementChecks ?? {};
        state.members = structuredClone(nextGroup.members);
        state.expenses = normalizeExpenses(structuredClone(nextGroup.expenses), nextGroup.updatedAt);
        state.activeTab = "expenses";
        if (openDetail) currentScreen = "detail";
        saveState();
        render();
        refreshSettlement();
        trackEvent("group_opened", {
          member_count: state.members.length,
          expense_count: state.expenses.length,
        });
      }

      function parseMemberNames(value) {
        return [
          ...new Set(
            String(value)
              .split(/[\n,、]+/)
              .map((name) => name.trim())
              .filter(Boolean),
          ),
        ];
      }

      async function createGroup(formData) {
        if (!requireDatabaseAvailable()) return unavailableMessage();
        const groupName = String(formData.get("name") || "").trim();
        const memberNames = parseMemberNames(formData.get("members"));

        if (!groupName) return "グループ名を入力してください";
        if (memberNames.length < 2) return "メンバーを2人以上入力してください";

        if (useRemote()) {
          const group = await apiJson("/api/groups", {
            method: "POST",
            body: JSON.stringify({ name: groupName, members: memberNames, colors }),
          });
          applyRemoteGroup(group, state.groups, { touch: true, openDetail: true });
          closeGroupSheet();
          await refreshSettlement();
          trackEvent("group_created", { member_count: memberNames.length });
          showToast("グループを保存しました");
          return "";
        }

        syncActiveGroup();
        const id = `g${Date.now().toString(36)}`;
        const members = memberNames.map((name, index) => ({
          id: `m${Date.now().toString(36)}${index}`,
          name,
          color: colors[index % colors.length],
          linkedToCurrentUser: index === 0,
          available: index !== 0,
        }));

        const newGroup = {
          id,
          groupName,
          inviteToken: "",
          canManage: true,
          completedAt: null,
          settlementChecks: {},
          members,
          expenses: [],
          memberCount: members.length,
          expenseCount: 0,
          totalAmount: 0,
          updatedAt: new Date().toISOString(),
        };

        state.groups.unshift(newGroup);
        state.activeGroupId = id;
        state.groupName = groupName;
        state.inviteToken = "";
        state.canManage = true;
        state.settlementChecks = {};
        state.members = structuredClone(members);
        state.expenses = [];
        state.activeTab = "expenses";
        currentScreen = "detail";
        saveState({ touch: true });
        closeGroupSheet();
        render();
        refreshSettlement();
        trackEvent("group_created", { member_count: memberNames.length });
        showToast("グループを作成しました");
        return "";
      }

      async function addMember(name) {
        if (!requireDatabaseAvailable()) return;
        const trimmed = name.trim();
        if (!trimmed) return;

        if (useRemote()) {
          if (!state.activeGroupId) {
            showToast("先にグループを作成してください");
            return;
          }
          const group = await apiJson(`/api/groups/${encodeURIComponent(state.activeGroupId)}/members`, {
            method: "POST",
            body: JSON.stringify({
              name: trimmed,
              color: colors[state.members.length % colors.length],
            }),
          });
          applyRemoteGroup(group, state.groups, { touch: true, openDetail: true });
          await refreshSettlement();
          trackEvent("member_added", { member_count: state.members.length });
          showToast("メンバーを保存しました");
          return;
        }

        const id = `m${Date.now().toString(36)}`;
        state.members.push({
          id,
          name: trimmed,
          color: colors[state.members.length % colors.length],
          available: true,
          linkedToCurrentUser: false,
        });
        state.expenses = state.expenses.map((expense) => ({
          ...expense,
          debtorMemberIds: [...new Set([...expense.debtorMemberIds, id])],
        }));
        state.completedAt = null;
        state.settlementChecks = {};
        saveState({ touch: true });
        refreshSettlement();
        trackEvent("member_added", { member_count: state.members.length });
        showToast("メンバーを追加しました");
      }

      async function deleteExpense(id) {
        if (!requireDatabaseAvailable()) return;
        if (useRemote()) {
          const group = await apiJson(
            `/api/groups/${encodeURIComponent(state.activeGroupId)}/expenses/${encodeURIComponent(id)}`,
            { method: "DELETE" },
          );
          applyRemoteGroup(group, state.groups, { touch: true, openDetail: true });
          await refreshSettlement();
          trackEvent("expense_deleted", { expense_count: state.expenses.length });
          showToast("支払いを削除しました");
          return;
        }

        state.expenses = state.expenses.filter((expense) => expense.id !== id);
        state.completedAt = null;
        state.settlementChecks = {};
        saveState({ touch: true });
        refreshSettlement();
        trackEvent("expense_deleted", { expense_count: state.expenses.length });
      }

      async function deleteMember(id) {
        if (!requireDatabaseAvailable()) return;
        if (state.members.length <= 2) return;

        if (useRemote()) {
          const group = await apiJson(
            `/api/groups/${encodeURIComponent(state.activeGroupId)}/members/${encodeURIComponent(id)}`,
            { method: "DELETE" },
          );
          applyRemoteGroup(group, state.groups, { touch: true, openDetail: true });
          await refreshSettlement();
          trackEvent("member_deleted", { member_count: state.members.length });
          showToast("メンバーを削除しました");
          return;
        }

        state.members = state.members.filter((member) => member.id !== id);
        state.expenses = state.expenses
          .filter((expense) => expense.payerMemberId !== id)
          .map((expense) => ({
            ...expense,
            debtorMemberIds: expense.debtorMemberIds.filter((memberId) => memberId !== id),
          }))
          .filter((expense) => expense.debtorMemberIds.length > 0);
        state.completedAt = null;
        state.settlementChecks = {};
        saveState({ touch: true });
        refreshSettlement();
        trackEvent("member_deleted", { member_count: state.members.length });
        showToast("メンバーを削除しました");
      }

      async function claimCurrentMember(id) {
        if (!requireDatabaseAvailable()) return;
        if (useRemote()) {
          const group = await apiJson(
            `/api/groups/${encodeURIComponent(state.activeGroupId)}/members/${encodeURIComponent(id)}/claim`,
            { method: "POST" },
          );
          applyRemoteGroup(group, state.groups, { touch: true, openDetail: true });
          showToast("自分のメンバーにしました");
          return;
        }

        state.members = state.members.map((member) => ({
          ...member,
          linkedToCurrentUser: member.id === id,
          available: member.id === id ? false : member.linkedToCurrentUser ? true : member.available !== false,
        }));
        saveState({ touch: true });
        render();
        showToast("自分のメンバーにしました");
      }

      async function unlinkCurrentMember(id) {
        if (!requireDatabaseAvailable()) return;
        if (useRemote()) {
          const result = await apiJson(
            `/api/groups/${encodeURIComponent(state.activeGroupId)}/members/${encodeURIComponent(id)}/claim`,
            { method: "DELETE" },
          );
          if (result.unlinked) {
            currentScreen = "home";
            await loadRemoteState().catch(() => {
              state = emptyRemoteState([]);
              render();
            });
            showToast("メンバー紐づけを解除しました");
            return;
          }
          applyRemoteGroup(result, state.groups, { touch: true, openDetail: true });
          showToast("メンバー紐づけを解除しました");
          return;
        }

        state.members = state.members.map((member) =>
          member.id === id ? { ...member, linkedToCurrentUser: false, available: true } : member,
        );
        saveState({ touch: true });
        render();
        showToast("メンバー紐づけを解除しました");
      }

      async function inviteLink() {
        if (!state.activeGroupId) return config.line?.miniAppBaseUrl || location.href;
        const token = state.inviteToken ? `?token=${encodeURIComponent(state.inviteToken)}` : "";
        const path = `/groups/${encodeURIComponent(state.activeGroupId)}/invite${token}`;
        const response = await fetch(`/api/permanent-link?path=${encodeURIComponent(path)}`);
        const data = await response.json();
        return data.permanentLink || data.endpointUrl || location.href;
      }

      function settlementText(link) {
        const lines = [`${state.groupName}の清算`, `合計 ${yen(totalExpenses())}`];
        if (settlement.items?.length) {
          settlement.items.forEach((item) => {
            const from = memberById(item.fromMemberId)?.name ?? "不明";
            const to = memberById(item.toMemberId)?.name ?? "不明";
            lines.push(`${from} → ${to} ${yen(item.amount)}`);
          });
        } else {
          lines.push("清算は不要です");
        }
        lines.push(link);
        return lines.join("\n");
      }

      function paymentRequestText(item, link) {
        const from = memberById(item.fromMemberId)?.name ?? "不明";
        const to = memberById(item.toMemberId)?.name ?? "不明";
        return [
          `${from}さんへ`,
          `${state.groupName}の清算お願いします。`,
          `${to}さんに ${yen(item.amount)} を送ってください。`,
          link,
        ].join("\n");
      }

      async function shareSettlement() {
        const link = await inviteLink();
        const text = settlementText(link);

        if (window.liff?.isInClient?.() && window.liff?.isApiAvailable?.("shareTargetPicker")) {
          await liff.shareTargetPicker([{ type: "text", text }]);
          trackEvent("settlement_shared", { method: "share_target_picker" });
          showToast("LINEで共有しました");
          return;
        }

        await copyText(text);
        trackEvent("settlement_shared", { method: "clipboard" });
        showToast("共有文をコピーしました");
      }

      async function requestPayment(key) {
        const item = (settlement.items ?? []).find((candidate) => settlementItemKey(candidate) === key);
        if (!item) return;

        const link = await inviteLink();
        const text = paymentRequestText(item, link);
        if (window.liff?.isInClient?.() && window.liff?.isApiAvailable?.("shareTargetPicker")) {
          await liff.shareTargetPicker([{ type: "text", text }]);
          trackEvent("payment_requested", { method: "share_target_picker" });
          showToast("請求メッセージを送信しました");
          return;
        }

        await copyText(text);
        trackEvent("payment_requested", { method: "clipboard" });
        showToast("請求メッセージをコピーしました");
      }

      async function copyInvite() {
        const link = await inviteLink();
        await copyText(link);
        trackEvent("invite_copied");
        showToast("招待リンクをコピーしました");
      }

      async function joinInvite() {
        if (!inviteContext) return;
        if (!requireDatabaseAvailable()) return;
        if (!currentUserAuthenticated) {
          showToast("LINEログイン後に参加できます");
          if (window.liff && !liff.isLoggedIn?.()) liff.login({ redirectUri: location.href });
          return;
        }

        const selectedMember = document.querySelector('input[name="invite-member"]:checked')?.value ?? "new";
        const inputName = document.getElementById("invite-name")?.value ?? "";
        const payload = {
          token: inviteContext.token,
          memberId: selectedMember === "new" ? "" : selectedMember,
          name: selectedMember === "new" ? inputName || currentUserName : "",
          color: colors[state.members.length % colors.length],
        };
        const group = await apiJson(`/api/invites/${encodeURIComponent(inviteContext.groupId)}/join`, {
          method: "POST",
          body: JSON.stringify(payload),
        });
        inviteContext = null;
        invitePreview = null;
        history.replaceState(null, "", "/");
        applyRemoteGroup(group, state.groups, { touch: true, openDetail: true });
        await refreshSettlement();
        trackEvent("invite_joined", { member_count: state.members.length });
        showToast("グループに参加しました");
      }

      async function saveGroupName(formData) {
        if (!requireDatabaseAvailable()) return unavailableMessage();
        if (!state.activeGroupId) return "";

        const groupName = String(formData.get("name") || "").trim();
        if (!groupName) return "グループ名を入力してください";
        if (groupName.length > 40) return "グループ名が長すぎます";

        if (useRemote()) {
          const group = await apiJson(`/api/groups/${encodeURIComponent(state.activeGroupId)}`, {
            method: "PATCH",
            body: JSON.stringify({ name: groupName }),
          });
          applyRemoteGroup(group, state.groups, { touch: true, openDetail: true });
          closeEditGroupSheet();
          await refreshSettlement();
          trackEvent("group_renamed");
          showToast("グループ名を保存しました");
          return "";
        }

        state.groupName = groupName;
        saveState({ touch: true });
        closeEditGroupSheet();
        render();
        trackEvent("group_renamed");
        showToast("グループ名を保存しました");
        return "";
      }

      async function toggleCurrentGroupCompleted() {
        if (!requireDatabaseAvailable()) return;
        if (!state.activeGroupId || !state.canManage) return;
        const completed = !isCurrentGroupCompleted();

        if (useRemote()) {
          const group = await apiJson(`/api/groups/${encodeURIComponent(state.activeGroupId)}`, {
            method: "PATCH",
            body: JSON.stringify({ completed }),
          });
          applyRemoteGroup(group, state.groups, { touch: true, openDetail: true });
          await refreshSettlement();
          trackEvent(completed ? "group_completed" : "group_reopened");
          showToast(completed ? "グループを完了にしました" : "完了を解除しました");
          return;
        }

        state.completedAt = completed ? new Date().toISOString() : null;
        saveState({ touch: true });
        render();
        trackEvent(completed ? "group_completed" : "group_reopened");
        showToast(completed ? "グループを完了にしました" : "完了を解除しました");
      }

      async function deleteCurrentGroup() {
        if (!requireDatabaseAvailable()) return;
        if (!state.activeGroupId) return;
        if (!state.canManage) {
          showToast("グループの削除は作成者だけが実行できます");
          return;
        }
        if (!confirm(`${state.groupName}を削除しますか？\nこの操作は元に戻せません。`)) return;

        if (useRemote()) {
          await apiJson(`/api/groups/${encodeURIComponent(state.activeGroupId)}`, { method: "DELETE" });
          const data = await apiJson("/api/groups");
          currentScreen = "home";
          state = data.groups?.length ? { ...state, groups: data.groups } : emptyRemoteState([]);
          if (data.groups?.length) {
            const nextGroup = data.groups[0];
            const group = await apiJson(`/api/groups/${encodeURIComponent(nextGroup.id)}`);
            applyRemoteGroup(group, data.groups, { openDetail: false });
          } else {
            currentScreen = "home";
            render();
          }
          await refreshSettlement();
          trackEvent("group_deleted");
          showToast("グループを削除しました");
          return;
        }

        state.groups = state.groups.filter((group) => group.id !== state.activeGroupId);
        const nextGroup = state.groups[0];
        if (nextGroup) {
          state.activeGroupId = nextGroup.id;
          state.groupName = nextGroup.groupName;
          state.inviteToken = nextGroup.inviteToken || "";
          state.canManage = nextGroup.canManage !== false;
          state.completedAt = nextGroup.completedAt || null;
          state.members = structuredClone(nextGroup.members);
          state.expenses = normalizeExpenses(structuredClone(nextGroup.expenses), nextGroup.updatedAt);
          state.settlementChecks = nextGroup.settlementChecks ?? {};
        } else {
          state = emptyRemoteState([]);
        }
        currentScreen = "home";
        saveState();
        render();
        refreshSettlement();
        trackEvent("group_deleted");
        showToast("グループを削除しました");
      }

      async function toggleSettlement(key) {
        if (!requireDatabaseAvailable()) return;
        const item = (settlement.items ?? []).find((candidate) => settlementItemKey(candidate) === key);
        if (!item) return;
        const checked = !confirmationKeys().has(key);

        if (useRemote()) {
          const data = await apiJson(`/api/groups/${encodeURIComponent(state.activeGroupId)}/settlement/confirmations`, {
            method: "POST",
            body: JSON.stringify({
              fromMemberId: item.fromMemberId,
              toMemberId: item.toMemberId,
              amount: item.amount,
              checked,
            }),
          });
          settlement = { ...settlement, confirmations: data.confirmations ?? [] };
          render();
          trackEvent(checked ? "settlement_confirmed" : "settlement_unconfirmed");
          showToast(checked ? "精算済みにしました" : "未精算に戻しました");
          return;
        }

        if (!state.settlementChecks) state.settlementChecks = {};
        if (checked) state.settlementChecks[key] = { ...item, confirmedAt: new Date().toISOString() };
        else delete state.settlementChecks[key];
        saveState();
        settlement = {
          ...settlement,
          confirmations: Object.values(state.settlementChecks).filter(Boolean),
        };
        render();
        trackEvent(checked ? "settlement_confirmed" : "settlement_unconfirmed");
      }

      async function copyText(text) {
        if (navigator.clipboard?.writeText) {
          await navigator.clipboard.writeText(text);
          return;
        }
        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.setAttribute("readonly", "");
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        textarea.remove();
      }

      function showToast(message) {
        clearTimeout(toastTimer);
        elements.toast.textContent = message;
        elements.toast.hidden = false;
        toastTimer = setTimeout(() => {
          elements.toast.hidden = true;
        }, 2400);
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      async function refreshSession() {
        const response = await fetch("/api/me");
        return response.json();
      }

      async function authenticateWithLine() {
        const idToken = liff.getIDToken();
        if (!idToken) return;

        const response = await fetch("/api/auth/line", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ idToken }),
        });
        await response.json();
      }

      async function initializeMiniApp() {
        config = await fetch("/api/config").then((response) => response.json());
        initializeAnalytics();
        const session = await refreshSession().catch(() => null);
        currentUserAuthenticated = Boolean(session?.authenticated);
        const storageAvailable = await checkStorageStatus();
        trackInitialPageView();
        if (!storageAvailable) return;

        await loadInvitePreview().catch((error) => {
          cloudStorageNotice = error.message || "招待リンクを確認できませんでした";
          render();
        });

        if (!config.line.liffId) {
          await loadRemoteState().catch(() => {
            appUnavailable = true;
            cloudStorageNotice = unavailableMessage();
            state = emptyRemoteState([]);
            render();
          });
          return;
        }

        if (!window.liff) {
          if (session?.authenticated) await loadRemoteState().catch(() => {
            appUnavailable = true;
            cloudStorageNotice = unavailableMessage();
            state = emptyRemoteState([]);
            render();
          });
          return;
        }

        await liff.init({ liffId: config.line.liffId });

        if (liff.isLoggedIn()) {
          const profile = await liff.getProfile().catch(() => null);
          if (profile?.displayName) currentUserName = profile.displayName;
          await authenticateWithLine().catch(() => null);
          currentUserAuthenticated = true;
          render();
          await loadRemoteState().catch(() => {
            appUnavailable = true;
            cloudStorageNotice = unavailableMessage();
            state = emptyRemoteState([]);
            render();
          });
          return;
        }

        if (session?.authenticated) await loadRemoteState().catch(() => {
          appUnavailable = true;
          cloudStorageNotice = unavailableMessage();
          state = emptyRemoteState([]);
          render();
        });
      }

      });

      elements.form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const error = await saveExpense(new FormData(elements.form)).catch((caughtError) => caughtError.message);
        elements.formError.textContent = error;
      });

      elements.groupForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const error = await createGroup(new FormData(elements.groupForm)).catch((caughtError) => caughtError.message);
        elements.groupFormError.textContent = error;
      });

      elements.editGroupForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const error = await saveGroupName(new FormData(elements.editGroupForm)).catch((caughtError) => caughtError.message);
        elements.editGroupFormError.textContent = error;
      });

      elements.membersView.addEventListener("submit", async (event) => {
        const form = event.target.closest("#member-form");
        if (!form) return;
        event.preventDefault();
        const input = form.querySelector("#member-name");
        await addMember(input.value).catch((error) => showToast(error.message));
        input.value = "";
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          closeAllSheets();
          closeAppMenu();
        }
      });

      render();
      refreshSettlement();
      initializeMiniApp().catch(() => {
        appUnavailable = true;
        cloudStorageNotice = unavailableMessage();
        state = emptyRemoteState([]);
        render();
      });
    </script>
  </body>
</html>
